<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ese día me convertí en un Chevy Pop verde lima y mi vecina me usa de Uber</title>
    <style>
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Courier New", Courier, monospace;
            margin: 0;
            padding: 10px;
        }

        .main-table {
            width: 700px;
            margin: 0 auto;
            border: 2px solid #000000;
            background-color: #ffffff;
        }

        .header-cell {
            text-align: center;
            background-color: #000000;
            padding: 10px;
        }

        .banner-container img {
            width: 100%;
            height: auto;
            border: 1px solid #ffffff;
        }

        .marquee-container {
            background-color: #000000;
            color: #ffffff;
            font-weight: bold;
            padding: 4px;
            font-size: 14px;
            text-align: center;
            border-bottom: 2px solid #000000;
        }

        .content-cell {
            padding: 20px;
            background-color: #ffffff;
        }

        h1 {
            font-size: 18px;
            text-align: center;
            text-decoration: underline;
            margin-top: 0;
        }

        .retro-box {
            border: 2px solid #000000;
            background-color: #f0f0f0;
            padding: 10px;
            margin-bottom: 15px;
        }

        .episode-btn {
            display: block;
            width: 100%;
            padding: 8px;
            margin-bottom: 5px;
            background-color: #e0e0e0;
            color: #000000;
            border: 2px outset #ffffff;
            text-align: left;
            font-family: "Courier New", Courier, monospace;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
        }

        .episode-btn:active {
            border-style: inset;
        }

        .episode-btn:hover {
            background-color: #000000;
            color: #ffffff;
        }

        footer {
            text-align: center;
            font-size: 11px;
            padding: 10px;
            border-top: 1px dashed #000000;
            margin-top: 20px;
        }

        .counter {
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            margin-top: 10px;
            background: #000;
            color: #fff;
            display: inline-block;
            padding: 2px 6px;
        }
    </style>
</head>
<body>

    <table class="main-table" align="center" cellspacing="0" cellpadding="0">
        <tr>
            <td class="header-cell">
                <div class="banner-container">
                    <img src="https://raw.githubusercontent.com/loslocos817yt-star/ChevyPopLima/refs/heads/main/assets/banner.png" alt="Banner del Anime">
                </div>
            </td>
        </tr>
        <tr>
            <td>
                <div class="marquee-container">
                   BIENVENIDOS A LA PAGINA WEB DE LA HISTORIA MAS PENDEJA DEL MUNDO.
                </div>
            </td>
        </tr>
        <tr>
            <td class="content-cell">
                <h1>ÍNDICE DE EPISODIOS</h1>
                
                <div class="retro-box">
                    <p style="margin: 0 0 10px 0; font-size: 13px;">Selecciona un episodio para leerlo directamente en el sistema:</p>
                    
                    <!-- Aquí se cargarán los botones de los episodios desde el JSON -->
                    <div id="lista-episodios">
                        <p style="font-style: italic; font-size: 12px;">Cargando base de datos...</p>
                    </div>
                </div>

                <!-- Iframe clásico para cargar el texto y evitar bloqueos -->
                <iframe id="reader-frame" name="visor" src="" style="display:none; width:100%; height:400px; background:#ffffff; border:2px inset #000000; margin-top:15px; box-sizing: border-box;"></iframe>

                <div style="text-align: center;">
                    <div class="counter">VISITAS: 000069</div>
                </div>
            </td>
        </tr>
        <tr>
            <td>
                <footer>
                    <p>&copy; Preparen el Cloro. </p>
                </footer>
            </td>
        </tr>
    </table>

    <script>
        // URL de tu JSON crudo en GitHub
        const jsonUrl = 'https://raw.githubusercontent.com/loslocos817yt-star/ChevyPopLima/refs/heads/main/EP/episodios.json';

        // Cargar la lista de episodios al abrir la página
        window.onload = function() {
            fetch(jsonUrl)
                .then(response => response.json())
                .then(data => {
                    const contenedorLista = document.getElementById('lista-episodios');
                    contenedorLista.innerHTML = ''; // Limpiamos el mensaje de "Cargando"

                    // Recorremos el JSON y creamos un enlace por cada episodio
                    data.forEach(episodio => {
                        const enlace = document.createElement('a');
                        enlace.className = 'episode-btn';
                        enlace.href = episodio.link;
                        enlace.target = 'visor'; // Esto hace que el link se abra dentro del iframe
                        enlace.onclick = function() {
                            // Mostramos el iframe cuando se le da clic al botón
                            document.getElementById('reader-frame').style.display = 'block';
                        };
                        enlace.innerHTML = `&gt;&gt; [EP ${episodio.num}] ${episodio.EP}`;
                        contenedorLista.appendChild(enlace);
                    });
                })
                .catch(error => {
                    document.getElementById('lista-episodios').innerHTML = '<p style="color: red;">Error al conectar con el servidor.</p>';
                    console.error('Error cargando el JSON:', error);
                });
        };
    </script>

</body>
</html>
