<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ese día me convertí en un Chevy Pop verde lima y mi vecina me usa de Uber</title>
    <style>
        :root {
            --bg-color: #000000;
            --panel-bg: #111111;
            --text-color: #ffffff;
            --border-color: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
        }

        header {
            text-align: center;
            padding: 20px;
            background: #000;
            border-bottom: 3px solid var(--border-color);
        }

        .banner-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .banner-container img {
            width: 100%;
            height: auto;
            border: 2px solid var(--border-color);
            filter: grayscale(100%);
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            background-color: var(--panel-bg);
            border: 2px solid var(--border-color);
        }

        h1 {
            color: var(--text-color);
            font-size: 1.5rem;
            text-align: center;
            letter-spacing: 2px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 10px;
        }

        .episode-list {
            list-style: none;
            padding: 0;
        }

        .episode-list li {
            margin: 15px 0;
        }

        .episode-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #000000;
            color: var(--text-color);
            border: 2px solid var(--border-color);
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1rem;
            cursor: pointer;
            text-decoration: none;
            transition: 0.1s;
        }

        .episode-btn:hover {
            background-color: #ffffff;
            color: #000000;
            font-weight: bold;
        }

        #reader-container {
            margin-top: 20px;
            padding: 20px;
            background: #000000;
            border: 2px solid var(--border-color);
            display: none;
            white-space: pre-wrap;
            font-family: 'Courier New', Courier, monospace;
            color: #ffffff;
            max-height: 400px;
            overflow-y: auto;
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.8rem;
            color: #888888;
            border-top: 1px solid #333333;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header>
        <div class="banner-container">
            <!-- Banner oficial cargado desde GitHub (convertido a escala de grises para mantener el tema) -->
            <img src="https://raw.githubusercontent.com/loslocos817yt-star/ChevyPopLima/refs/heads/main/assets/banner.png" alt="Banner del Anime">
        </div>
    </header>

    <div class="container">
        <h1>EPISODIOS DISPONIBLES</h1>
        <ul class="episode-list">
            <li>
                <button class="episode-btn" onclick="cargarEpisodio('EP/carroviolador.txt')">
                    [EP 1] Carro Violador
                </button>
            </li>
        </ul>

        <div id="reader-container"></div>
    </div>

    <footer>
        <p>&copy; 2026 - Todos los derechos reservados al Chevy Pop.</p>
    </footer>

    <script>
        function cargarEpisodio(url) {
            const reader = document.getElementById('reader-container');
            reader.style.display = 'block';
            reader.innerText = 'Cargando episodio...';

            fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('No se pudo cargar el archivo del episodio.');
                    }
                    return response.text();
                })
                .then(data => {
                    reader.innerText = data;
                })
                .catch(error => {
                    reader.innerText = 'Error al cargar el episodio: ' + error.message;
                });
        }
    </script>

</body>
</html>
