<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ese día me convertí en un Chevy Pop verde lima y mi vecina me usa de Uber</title>
    <style>
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Courier New", Courier, monospace;
            margin: 0;
            padding: 10px;
        }

        .main-table {
            width: 700px;
            margin: 0 auto;
            border: 2px solid #000000;
            background-color: #ffffff;
        }

        .header-cell {
            text-align: center;
            background-color: #000000;
            padding: 10px;
        }

        .banner-container img {
            width: 100%;
            height: auto;
            border: 1px solid #ffffff;
            /* La imagen se deja exactamente como la pediste, sin filtros */
        }

        .marquee-container {
            background-color: #000000;
            color: #ffffff;
            font-weight: bold;
            padding: 4px;
            font-size: 14px;
            text-align: center;
            border-bottom: 2px solid #000000;
        }

        .content-cell {
            padding: 20px;
            background-color: #ffffff;
        }

        h1 {
            font-size: 18px;
            text-align: center;
            text-decoration: underline;
            margin-top: 0;
        }

        .retro-box {
            border: 2px solid #000000;
            background-color: #f0f0f0;
            padding: 10px;
            margin-bottom: 15px;
        }

        .episode-btn {
            display: block;
            width: 100%;
            padding: 8px;
            background-color: #e0e0e0;
            color: #000000;
            border: 2px outset #ffffff;
            text-align: left;
            font-family: "Courier New", Courier, monospace;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
        }

        .episode-btn:active {
            border-style: inset;
        }

        .episode-btn:hover {
            background-color: #000000;
            color: #ffffff;
        }

        #reader-container {
            margin-top: 15px;
            padding: 15px;
            background: #ffffff;
            border: 2px inset #000000;
            display: none;
            white-space: pre-wrap;
            font-family: "Courier New", Courier, monospace;
            font-size: 13px;
            max-height: 350px;
            overflow-y: auto;
        }

        footer {
            text-align: center;
            font-size: 11px;
            padding: 10px;
            border-top: 1px dashed #000000;
            margin-top: 20px;
        }

        .counter {
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            margin-top: 10px;
            background: #000;
            color: #fff;
            display: inline-block;
            padding: 2px 6px;
        }
    </style>
</head>
<body>

    <table class="main-table" align="center" cellspacing="0" cellpadding="0">
        <tr>
            <td class="header-cell">
                <div class="banner-container">
                    <!-- Imagen original sin modificar -->
                    <img src="https://raw.githubusercontent.com/loslocos817yt-star/ChevyPopLima/refs/heads/main/assets/banner.png" alt="Banner del Anime">
                </div>
            </td>
        </tr>
        <tr>
            <td>
                <div class="marquee-container">
                    *** BIENVENIDOS AL FORO OFICIAL DEL ANIME DEL CHEVY POP ***
                </div>
            </td>
        </tr>
        <tr>
            <td class="content-cell">
                <h1>ÍNDICE DE EPISODIOS</h1>
                
                <div class="retro-box">
                    <p style="margin: 0 0 10px 0; font-size: 13px;">Selecciona un episodio para leerlo directamente en el sistema:</p>
                    <button class="episode-btn" onclick="cargarEpisodio('EP/carroviolador.txt')">
                        &gt;&gt; [EP 1] Carro Violador
                    </button>
                </div>

                <div id="reader-container"></div>

                <div style="text-align: center;">
                    <div class="counter">VISITAS: 000069</div>
                </div>
            </td>
        </tr>
        <tr>
            <td>
                <footer>
                    <p>&copy; 1996-2006 Foro Chevy Pop Net. Optimizado para Netscape Navigator e Internet Explorer 4.0</p>
                </footer>
            </td>
        </tr>
    </table>

    <script>
        function cargarEpisodio(url) {
            const reader = document.getElementById('reader-container');
            reader.style.display = 'block';
            reader.innerText = 'Cargando archivo de texto...';

            fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('No se pudo encontrar el archivo en la carpeta EP/');
                    }
                    return response.text();
                })
                .then(data => {
                    reader.innerText = data;
                })
                .catch(error => {
                    reader.innerText = 'Error: ' + error.message;
                });
        }
    </script>

</body>
</html>
