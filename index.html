<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ese día me convertí en un Chevy Pop verde lima y mi vecina me usa de Uber</title>
    
    <!-- FAVICON OFICIAL -->
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/loslocos817yt-star/ChevyPopLima/refs/heads/main/assets/favicon.png">

    <style>
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Courier New", Courier, monospace;
            margin: 0;
            padding: 10px;
        }

        /* ESTILOS DEL MODAL DE IDIOMA (ESTILO BIOS 90s) */
        #language-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000000;
            color: #ffffff;
            z-index: 9999;
            text-align: center;
            padding-top: 50px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        #language-modal h2 {
            text-decoration: underline;
            margin-bottom: 30px;
        }

        .lang-btn {
            display: block;
            width: 250px;
            margin: 10px auto;
            padding: 10px;
            background-color: #000000;
            color: #ffffff;
            border: 2px solid #ffffff;
            font-family: "Courier New", Courier, monospace;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .lang-btn:hover {
            background-color: #ffffff;
            color: #000000;
        }

        /* ESTILOS DE LA PÁGINA NORMAL */
        .main-table {
            width: 700px;
            max-width: 100%;
            margin: 0 auto;
            border: 2px solid #000000;
            background-color: #ffffff;
        }

        .header-cell {
            text-align: center;
            background-color: #000000;
            padding: 10px;
        }

        .banner-container img {
            width: 100%;
            height: auto;
            border: 1px solid #ffffff;
        }

        .marquee-container {
            background-color: #000000;
            color: #ffffff;
            font-weight: bold;
            padding: 4px;
            font-size: 14px;
            text-align: center;
            border-bottom: 2px solid #000000;
        }

        .content-cell {
            padding: 20px;
            background-color: #ffffff;
        }

        h1 {
            font-size: 18px;
            text-align: center;
            text-decoration: underline;
            margin-top: 0;
        }

        .retro-box {
            border: 2px solid #000000;
            background-color: #f0f0f0;
            padding: 15px;
            margin-bottom: 15px;
        }

        /* BANNERS DE TEMPORADA Y ACORDEON */
        .season-group {
            margin-bottom: 15px; /* Espacio entre cada bloque de temporada */
        }

        .season-banner {
            display: block;
            width: 100%;
            height: auto;
            border: 3px outset #ffffff;
            outline: 2px solid #000000;
            cursor: pointer;
            box-sizing: border-box;
        }

        .season-banner:hover {
            outline-color: #ff0000;
        }

        .season-banner.activa {
            border-style: inset;
            outline: 3px solid #000000;
        }

        /* CAJA DE EPISODIOS DEBAJO DEL BANNER */
        .episodios-lista {
            display: none;
            margin-top: 10px;
            padding: 10px;
            background-color: #e8e8e8;
            border: 2px dashed #000000;
        }

        .episode-btn {
            display: block;
            width: 100%;
            padding: 8px;
            margin-bottom: 5px;
            background-color: #dcdcdc;
            color: #000000;
            border: 2px outset #ffffff;
            text-align: left;
            font-family: "Courier New", Courier, monospace;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
        }

        .episode-btn:active {
            border-style: inset;
        }

        .episode-btn:hover {
            background-color: #000000;
            color: #ffffff;
        }

        #reader-container {
            margin-top: 15px;
            padding: 15px;
            background: #ffffff;
            border: 2px inset #000000;
            display: none;
            white-space: pre-wrap;
            font-family: "Courier New", Courier, monospace;
            font-size: 13px;
            max-height: 400px;
            overflow-y: auto;
        }

        footer {
            text-align: center;
            font-size: 11px;
            padding: 10px;
            border-top: 1px dashed #000000;
            margin-top: 20px;
        }

        .counter-container {
            text-align: center;
            margin-top: 20px;
            padding: 10px;
        }
    </style>
</head>
<body>

    <!-- MODAL DE SELECCIÓN DE IDIOMA -->
    <div id="language-modal">
        <h2>=== Selecciona tu lenguaje===</h2>
        <p>Selecciona tu idioma / Select your language</p>
        <div id="lang-buttons"></div>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <div id="main-content" style="display: none;">
        <table class="main-table" align="center" cellspacing="0" cellpadding="0">
            <tr>
                <td class="header-cell">
                    <div class="banner-container">
                        <img src="https://raw.githubusercontent.com/loslocos817yt-star/ChevyPopLima/refs/heads/main/assets/banner.png" alt="Banner del Anime">
                    </div>
                </td>
            </tr>
            <tr>
                <td>
                    <div class="marquee-container" data-translate="BIENVENIDOS A LA PAGINA WEB DE LA HISTORIA MAS PENDEJA DEL MUNDO.">
                       BIENVENIDOS A LA PAGINA WEB DE LA HISTORIA MAS PENDEJA DEL MUNDO.
                    </div>
                </td>
            </tr>
            <tr>
                <td class="content-cell">
                    <h1 data-translate="ÍNDICE DE EPISODIOS">ÍNDICE DE EPISODIOS</h1>

                    <!-- SELECTOR DE TEMPORADAS (ACORDEÓN) -->
                    <div class="retro-box">
                        <p style="margin: 0 0 15px 0; font-size: 13px; font-weight: bold;" data-translate="Selecciona una temporada:">Selecciona una temporada:</p>

                        <!-- BLOQUE TEMPORADA 1 -->
                        <div class="season-group">
                            <img id="banner-t1" class="season-banner"
                                 src="https://raw.githubusercontent.com/loslocos817yt-star/ChevyPopLima/refs/heads/main/assets/tempoarada1.Banner.png"
                                 alt="Temporada 1" onclick="mostrarTemporada(1)">
                            
                            <!-- Lista de Episodios (Aparece abajo del banner T1) -->
                            <div id="episodios-t1" class="episodios-lista"></div>
                        </div>

                        <!-- BLOQUE TEMPORADA 2 -->
                        <div class="season-group">
                            <img id="banner-t2" class="season-banner"
                                 src="https://raw.githubusercontent.com/loslocos817yt-star/ChevyPopLima/refs/heads/main/assets/tempoarada2.Banner.png"
                                 alt="Temporada 2" onclick="mostrarTemporada(2)">
                            
                            <!-- Lista de Episodios (Aparece abajo del banner T2) -->
                            <div id="episodios-t2" class="episodios-lista"></div>
                        </div>
                    </div>

                    <!-- LECTOR DE EPISODIOS -->
                    <div id="reader-container"></div>

                    <!-- CONTADOR DE VISITAS 90s -->
                    <div class="counter-container">
                        <p style="font-size: 12px; font-weight: bold; margin-bottom: 5px;" data-translate="VISITAS GLOBALES:">VISITAS GLOBALES:</p>
                        <script type="text/javascript" src="https://contador.websiteout.com/js/23/15/0/1"></script>
                    </div>
                </td>
            </tr>
            <tr>
                <td>
                    <footer>
                        <p data-translate="© Preparen el Cloro.">© Preparen el Cloro.</p>
                        <p style="margin-top: 5px; font-weight: bold;" data-translate="Creado por Doryan">Creado por Doryan</p>
                        <button onclick="resetearIdioma()" style="margin-top: 10px; font-size: 10px; cursor: pointer;">Cambiar Idioma</button>
                    </footer>
                </td>
            </tr>
        </table>
    </div>

    <script>
        // ================== TODO SE CARGA POR RAW DE GITHUB ==================
        const RAW_BASE = 'https://raw.githubusercontent.com/loslocos817yt-star/ChevyPopLima/refs/heads/main/';

        const JSON_URLS = [
            RAW_BASE + 'EP/episodios.json',
            'https://github.com/loslocos817yt-star/ChevyPopLima/raw/refs/heads/main/EP/episodios.json'
        ];

        function urlRaw(link) {
            if (/^https?:\/\//i.test(link)) return link;
            return RAW_BASE + link.replace(/^\/+/, '');
        }

        const idiomas = {
            'es': 'Español',
            'en': 'Inglés',
            'ru': 'Ruso',
            'pt': 'Portugués',
            'zh-CN': 'Chino',
            'ja': 'Japonés',
            'ko': 'Coreano',
            'de': 'Alemán',
            'nah': 'Náhuatl',
            'yua': 'Maya',
            'hi': 'Indio (Hindi)'
        };

        let currentLang = 'es';

        async function traducirTexto(texto, targetLang) {
            if (targetLang === 'es') return texto; 
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=es&tl=${targetLang}&dt=t&q=${encodeURIComponent(texto)}`;
            try {
                const res = await fetch(url);
                const json = await res.json();
                return json[0].map(item => item[0]).join('');
            } catch (e) {
                console.error("Error traduciendo:", e);
                return texto; 
            }
        }

        window.onload = function() {
            let guardado = null;
            try { guardado = localStorage.getItem('idiomaChevy'); } catch (e) {}
            if (!guardado) {
                mostrarSelectorIdioma();
            } else {
                iniciarPagina(guardado);
            }
        };

        function mostrarSelectorIdioma() {
            const modal = document.getElementById('language-modal');
            const contenedorBotones = document.getElementById('lang-buttons');
            contenedorBotones.innerHTML = '';

            for (const [codigo, nombre] of Object.entries(idiomas)) {
                const btn = document.createElement('button');
                btn.className = 'lang-btn';
                btn.innerText = `[ ${nombre} ]`;
                btn.onclick = () => {
                    try { localStorage.setItem('idiomaChevy', codigo); } catch (e) {}
                    modal.style.display = 'none';
                    iniciarPagina(codigo);
                };
                contenedorBotones.appendChild(btn);
            }
            modal.style.display = 'block';
        }

        async function iniciarPagina(lang) {
            currentLang = lang;
            document.getElementById('main-content').style.display = 'block';

            const elementosATraducir = document.querySelectorAll('[data-translate]');
            for (let el of elementosATraducir) {
                const textoOriginal = el.getAttribute('data-translate');
                el.innerText = await traducirTexto(textoOriginal, currentLang);
            }
        }

        async function cargarJSON() {
            let ultimoError = new Error('No se pudo cargar episodios.json');
            for (const url of JSON_URLS) {
                try {
                    const response = await fetch(url, { cache: 'no-store' });
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    return await response.json();
                } catch (e) {
                    ultimoError = e;
                }
            }
            throw ultimoError;
        }

        async function mostrarTemporada(numTemporada) {
            const prefijo = 't' + numTemporada;
            const reader = document.getElementById('reader-container');

            // 1. Limpiar e ocultar TODAS las listas de episodios y banners
            document.querySelectorAll('.season-banner').forEach(b => b.classList.remove('activa'));
            document.querySelectorAll('.episodios-lista').forEach(el => {
                el.style.display = 'none';
                el.innerHTML = '';
            });

            // 2. Marcar banner clickeado como activo
            document.getElementById('banner-t' + numTemporada).classList.add('activa');
            
            // 3. Seleccionar la lista específica que va debajo de este banner
            const contenedorLista = document.getElementById('episodios-t' + numTemporada);
            contenedorLista.style.display = 'block';

            // Cerrar lector anterior
            reader.style.display = 'none';
            reader.innerText = '';

            contenedorLista.innerHTML = '<p style="font-style: italic; font-size: 12px;">' +
                await traducirTexto('Cargando base de datos...', currentLang) + '</p>';

            try {
                const data = await cargarJSON();
                contenedorLista.innerHTML = ''; // Limpiar mensaje de carga

                // Agregar el texto de instrucción en el idioma correcto
                const instruccion = document.createElement('p');
                instruccion.style.margin = '0 0 10px 0';
                instruccion.style.fontSize = '13px';
                instruccion.innerText = await traducirTexto('Selecciona un episodio para leerlo directamente en el sistema:', currentLang);
                contenedorLista.appendChild(instruccion);

                const delaTemporada = data.filter(ep => String(ep.num).split('/')[0] === prefijo);

                if (delaTemporada.length === 0) {
                    contenedorLista.innerHTML += '<p style="font-style: italic; font-size: 12px;">' +
                        await traducirTexto('Próximamente...', currentLang) + '</p>';
                    return;
                }

                for (const episodio of delaTemporada) {
                    const tituloTraducido = await traducirTexto(episodio.EP, currentLang);
                    const numero = String(episodio.num).split('/')[1] || episodio.num;
                    const boton = document.createElement('button');
                    boton.className = 'episode-btn';
                    boton.onclick = function() { cargarEpisodio(episodio.link); };
                    boton.innerHTML = `&gt;&gt; [EP ${numero}] ${tituloTraducido}`;
                    contenedorLista.appendChild(boton);
                }
            } catch (error) {
                contenedorLista.innerHTML = '<p style="color: red;">Error cargando los capítulos. (' + error.message + ')</p>';
            }
        }

        async function cargarEpisodio(link) {
            const reader = document.getElementById('reader-container');
            reader.style.display = 'block';
            reader.innerText = await traducirTexto('Descargando archivo clasificado...', currentLang);

            // Bajar la vista automáticamente hacia el lector para mayor comodidad
            reader.scrollIntoView({ behavior: 'smooth', block: 'start' });

            fetch(urlRaw(link), { cache: 'no-store' })
                .then(response => {
                    if (!response.ok) throw new Error('Archivo no encontrado.');
                    return response.text();
                })
                .then(async data => {
                    reader.innerText = await traducirTexto('Traduciendo texto...', currentLang);
                    const textoTraducido = await traducirTexto(data, currentLang);
                    reader.innerText = textoTraducido;
                })
                .catch(error => {
                    reader.innerText = 'Error: ' + error.message;
                });
        }

        function resetearIdioma() {
            try { localStorage.removeItem('idiomaChevy'); } catch (e) {}
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('reader-container').style.display = 'none';
            
            document.querySelectorAll('.episodios-lista').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.season-banner').forEach(b => b.classList.remove('activa'));
            
            mostrarSelectorIdioma();
        }
    </script>

</body>
    </html>
