<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ese día me convertí en un Chevy Pop verde lima y mi vecina me usa de Uber</title>
    <style>
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Courier New", Courier, monospace;
            margin: 0;
            padding: 10px;
        }

        .main-table {
            width: 700px;
            max-width: 100%;
            margin: 0 auto;
            border: 2px solid #000000;
            background-color: #ffffff;
        }

        .header-cell {
            text-align: center;
            background-color: #000000;
            padding: 10px;
        }

        .banner-container img {
            width: 100%;
            height: auto;
            border: 1px solid #ffffff;
        }

        .marquee-container {
            background-color: #000000;
            color: #ffffff;
            font-weight: bold;
            padding: 4px;
            font-size: 14px;
            text-align: center;
            border-bottom: 2px solid #000000;
        }

        .content-cell {
            padding: 20px;
            background-color: #ffffff;
        }

        h1 {
            font-size: 18px;
            text-align: center;
            text-decoration: underline;
            margin-top: 0;
        }

        .retro-box {
            border: 2px solid #000000;
            background-color: #f0f0f0;
            padding: 10px;
            margin-bottom: 15px;
        }

        .episode-btn {
            display: block;
            width: 100%;
            padding: 8px;
            margin-bottom: 5px;
            background-color: #e0e0e0;
            color: #000000;
            border: 2px outset #ffffff;
            text-align: left;
            font-family: "Courier New", Courier, monospace;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
        }

        .episode-btn:active {
            border-style: inset;
        }

        .episode-btn:hover {
            background-color: #000000;
            color: #ffffff;
        }

        #reader-container {
            margin-top: 15px;
            padding: 15px;
            background: #ffffff;
            border: 2px inset #000000;
            display: none;
            white-space: pre-wrap;
            font-family: "Courier New", Courier, monospace;
            font-size: 13px;
            max-height: 400px;
            overflow-y: auto;
        }

        footer {
            text-align: center;
            font-size: 11px;
            padding: 10px;
            border-top: 1px dashed #000000;
            margin-top: 20px;
        }

        .counter {
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            margin-top: 10px;
            background: #000;
            color: #fff;
            display: inline-block;
            padding: 2px 6px;
        }
    </style>
</head>
<body>

    <table class="main-table" align="center" cellspacing="0" cellpadding="0">
        <tr>
            <td class="header-cell">
                <div class="banner-container">
                    <img src="https://raw.githubusercontent.com/loslocos817yt-star/ChevyPopLima/refs/heads/main/assets/banner.png" alt="Banner del Anime">
                </div>
            </td>
        </tr>
        <tr>
            <td>
                <div class="marquee-container">
                   BIENVENIDOS A LA PAGINA WEB DE LA HISTORIA MAS PENDEJA DEL MUNDO.
                </div>
            </td>
        </tr>
        <tr>
            <td class="content-cell">
                <h1>ÍNDICE DE EPISODIOS</h1>
                
                <div class="retro-box">
                    <p style="margin: 0 0 10px 0; font-size: 13px;">Selecciona un episodio para leerlo directamente en el sistema:</p>
                    
                    <div id="lista-episodios">
                        <p style="font-style: italic; font-size: 12px;">Cargando base de datos...</p>
                    </div>
                </div>

                <!-- Contenedor nativo que no es bloqueado por GitHub -->
                <div id="reader-container"></div>

                <div style="text-align: center;">
                    <div class="counter">VISITAS: 000069</div>
                </div>
            </td>
        </tr>
        <tr>
            <td>
                <footer>
                    <p>&copy; Preparen el Cloro. </p>
                </footer>
            </td>
        </tr>
    </table>

    <script>
        // Usamos una ruta relativa para el JSON porque tu página ya está alojada en el mismo repositorio
        const jsonUrl = 'EP/episodios.json';

        window.onload = function() {
            fetch(jsonUrl)
                .then(response => {
                    if (!response.ok) throw new Error('No se pudo encontrar episodios.json');
                    return response.json();
                })
                .then(data => {
                    const contenedorLista = document.getElementById('lista-episodios');
                    contenedorLista.innerHTML = ''; 

                    data.forEach(episodio => {
                        const boton = document.createElement('button');
                        boton.className = 'episode-btn';
                        boton.onclick = function() { cargarEpisodio(episodio.link); };
                        boton.innerHTML = `&gt;&gt; [EP ${episodio.num}] ${episodio.EP}`;
                        contenedorLista.appendChild(boton);
                    });
                })
                .catch(error => {
                    document.getElementById('lista-episodios').innerHTML = '<p style="color: red;">Error cargando los capítulos.</p>';
                });
        };

        function cargarEpisodio(url) {
            const reader = document.getElementById('reader-container');
            reader.style.display = 'block';
            reader.innerText = 'Cargando texto...';

            fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('No se encontró el archivo. Revisa que el nombre coincida exactamente (mayúsculas/minúsculas).');
                    }
                    return response.text();
                })
                .then(data => {
                    reader.innerText = data;
                })
                .catch(error => {
                    reader.innerText = 'Error: ' + error.message;
                });
        }
    </script>

</body>
</html>
